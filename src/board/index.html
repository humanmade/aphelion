<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#090909">
  <script>
    (() => {
      let theme = null
      try { theme = window.localStorage.getItem('aphelion-theme') } catch {}
      if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
    })()
  </script>
  <title>Aphelion — WordPress agent trail</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!--
  THESIS: The map is the interface; state stays visible while full evidence waits behind selection.
  OWN-WORLD: Near-black neutral planes, graphite place cards, and signal colour only for recorded state.
  STORY: Durable WordPress places stay put while agent work arrives over living flows and accumulates as quiet change tails.
  FIRST VIEWPORT: One instrument bar above a top-left anchored topology canvas; evidence opens only when requested.
  FORM: AgentTrail's stable touched-component map extended into durable WordPress entity topology; assigned direction seed b3813012.
  FINISH: unreviewed and undocumented is unfinished; this build ends with screenshot proof against the real trail.
  -->
  <a class="skip-link" href="#map">Skip to map</a>
  <div class="app-shell" data-app-state="loading" data-mode="live" data-inspector-open="false">
    <header class="chrome-bar" aria-label="Trail controls">
      <div class="brand">
        <div class="brand-identity" role="img" aria-label="Aphelion">
          <!-- Accelerate triangle mark decomposed into dots, morphing to an orb and back on loop -->
          <svg class="brand-mark" viewBox="0 0 25 25" aria-hidden="true">
          <g class="bm" style="--t:translate(2.5px,20.5px);--o:translate(15.3px,12.5px) scale(1.18);--oo:.98"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(5.8px,20.5px);--o:translate(9.0px,15.7px) scale(1.14);--oo:.94"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(9.2px,20.5px);--o:translate(13.0px,6.6px) scale(1.10);--oo:.90"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(12.5px,20.5px);--o:translate(16.6px,17.9px) scale(1.05);--oo:.86"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(15.8px,20.5px);--o:translate(5.2px,11.2px) scale(1.01);--oo:.82"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(19.2px,20.5px);--o:translate(19.2px,8.2px) scale(0.97);--oo:.79"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(22.5px,20.5px);--o:translate(10.4px,20.5px) scale(0.93);--oo:.75"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(21.7px,17.9px);--o:translate(8.6px,5.0px) scale(0.89);--oo:.71"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(20.8px,15.2px);--o:translate(20.6px,15.4px) scale(0.85);--oo:.67"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(20.0px,12.6px);--o:translate(4.6px,15.8px) scale(0.80);--oo:.63"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(19.2px,10.0px);--o:translate(16.1px,4.8px) scale(0.76);--oo:.59"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(18.3px,7.3px);--o:translate(15.0px,20.4px) scale(0.72);--oo:.55"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(17.5px,4.7px);--o:translate(5.6px,8.5px) scale(0.68);--oo:.51"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(15.0px,7.3px);--o:translate(19.8px,10.9px) scale(0.64);--oo:.47"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(12.5px,10.0px);--o:translate(8.6px,18.1px) scale(0.60);--oo:.44"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(10.0px,12.6px);--o:translate(11.7px,6.6px) scale(0.55);--oo:.40"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(7.5px,15.2px);--o:translate(16.1px,15.6px) scale(0.51);--oo:.36"><circle class="bd" r="1"/></g>
          <g class="bm" style="--t:translate(5.0px,17.9px);--o:translate(9.7px,12.6px) scale(0.47);--oo:.32"><circle class="bd" r="1"/></g>
          </svg>
          <span class="brand-word">aphelion</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
          <svg id="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="theme-moon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
        </button>
      </div>

      <label class="session-control">
        <span class="visually-hidden">Target and session</span>
        <select id="session-select" aria-label="Target and session">
          <option>Opening trail…</option>
        </select>
      </label>

      <div class="mode-switch" role="tablist" aria-label="Projection mode">
        <button type="button" role="tab" aria-selected="true" data-mode="live">Live</button>
        <button type="button" role="tab" aria-selected="false" data-mode="replay">Replay</button>
        <button type="button" role="tab" aria-selected="false" data-mode="timelapse">Timelapse</button>
      </div>

      <div class="playback-group" aria-label="Replay position">
        <button class="play-button" id="playback" type="button" disabled aria-label="Play trail">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <input id="scrubber" type="range" min="0" max="0" value="0" aria-label="Replay position" disabled>
        <span class="event-position" id="event-position">0 / 0</span>
        <span class="playback-caption" id="playback-caption">Waiting for evidence</span>
      </div>

      <span class="live-signal" id="live-signal" data-status="connecting"><i></i><span>Connecting</span></span>
    </header>

    <div class="observer-warning" id="observer-warning" role="status" aria-live="polite" hidden>
      <strong>Observer out of date</strong>
      <span>Some activity may not be recorded.</span>
    </div>

    <main class="map-surface" id="map" aria-label="WordPress agent work topology">
      <div class="component-flow" id="component-flow" aria-live="polite"></div>
    </main>

    <button class="inspector-scrim" id="inspector-scrim" type="button" aria-label="Close inspector" tabindex="-1"></button>
    <aside class="inspector" id="inspector" aria-label="Trail inspector" aria-hidden="true">
      <header class="inspector-header">
        <div>
          <strong id="inspector-title">Evidence</strong>
          <span id="inspector-subtitle">Select a place or flow</span>
        </div>
        <button class="inspector-close" id="inspector-close" type="button" aria-label="Close inspector">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="inspector-tabs" role="tablist" aria-label="Inspector view">
        <button type="button" role="tab" aria-selected="true" data-inspector-tab="place">Place</button>
        <button type="button" role="tab" aria-selected="false" data-inspector-tab="trail">Trail</button>
      </div>
      <section class="inspector-panel" id="place-panel" role="tabpanel"></section>
      <section class="inspector-panel" id="trail-panel" role="tabpanel" hidden></section>
    </aside>

    <div class="connection-banner" id="connection-banner" role="status" hidden>
      <strong>Connection paused.</strong>
      <span>The recorded trail is safe.</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
